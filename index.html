<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Created by Zua</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f0f11;
      color: #f4f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #18181c;
      border: 1px solid #2a2a30;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #32323a;
      margin: 0 auto 16px auto;
      display: block;
    }
    .badge {
      display: inline-block;
      background: #25252c;
      color: #a1a1aa;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      color: #a1a1aa;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      text-decoration: none;
      background: #ffffff;
      color: #0f0f11;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 12px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn.secondary {
      background: #25252c;
      color: #f4f4f6;
      border: 1px solid #32323a;
    }
    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" onerror="this.onerror=null; this.src='logo.jpg';" alt="Created by Zua Logo" class="logo" />
    <span class="badge">Official Portfolio</span>
    <h1>Created by Zua</h1>
    <p>Welcome to my creative space. Full portfolio and new projects launching soon.</p>
    <div class="links">
      <a href="https://www.instagram.com/createdbyzua/?hl=en" target="_blank" class="btn">Instagram</a>
      <a href="https://www.tiktok.com/@createdbyzua" target="_blank" rel="noopener noreferrer" class="btn secondary">TikTok</a>
      <a href="https://vimeo.com/user105343822" target="_blank" class="btn secondary">Vimeo</a>
      <a href="https://wa.me/923471674763" target="_blank" class="btn secondary">WhatsApp</a>
      <a href="mailto:createdbyzua@gmail.com" class="btn secondary">Email Me</a>
    </div>
    <footer>&copy; 2026 Created by Zua</footer>
  </div>
</body>
</html>
